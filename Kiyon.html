<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كيون | Power Zone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f1f5f9;color:#172033}
header{background:#101827;color:white;padding:25px;text-align:center}
.container{padding:20px}
h2{margin-bottom:20px}
.product{background:white;padding:18px;margin-bottom:15px;border-radius:12px;box-shadow:0 2px 8px #ddd}
.product h3{margin-bottom:12px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:7px}
button{background:#f59e0b;color:#111;padding:12px;border:0;border-radius:7px;width:100%;font-weight:bold}
a{color:white;text-decoration:none}
</style>
</head>
<body>

<header>
<h1>POWER ZONE</h1>
<p>قسم كيون - المفاتيح الكهربائية</p>
</header>

<div class="container">
<h2>منتجات كيون</h2>

<div class="product">
<h3>مفتاح كيون مفرد</h3>
<input type="number" min="1" value="1" placeholder="الكمية">
<button onclick="order('مفتاح كيون مفرد',this)">اطلب الآن</button>
</div>

<div class="product">
<h3>مفتاح كيون مزدوج</h3>
<input type="number" min="1" value="1" placeholder="الكمية">
<button onclick="order('مفتاح كيون مزدوج',this)">اطلب الآن</button>
</div>

<div class="product">
<h3>بريزة كيون</h3>
<input type="number" min="1" value="1" placeholder="الكمية">
<button onclick="order('بريزة كيون',this)">اطلب الآن</button>
</div>

</div>

<script>
function order(name,btn){
let quantity=btn.previousElementSibling.value;
if(quantity<1){
alert('من فضلك حدد الكمية');
return;
}
let message=`طلب من POWER ZONE:%0A${name}%0Aالكمية: ${quantity}`;
window.open('https://wa.me/?text='+message,'_blank');
}
</script>

</body>
</html>
