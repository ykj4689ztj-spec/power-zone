
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فينوس | Power Zone</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f6f8;color:#172033}
header{background:#101827;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:25px;font-weight:bold;color:#facc15}
.logo span{color:white}
header a{color:white;text-decoration:none}
.cart-link{background:#facc15;color:#101827;padding:9px 14px;border-radius:7px;font-weight:bold}
.hero{background:linear-gradient(120deg,#101827,#263b59);color:white;text-align:center;padding:50px 20px}
.hero h1{font-size:32px;margin-bottom:12px;color:#facc15}
.hero p{color:#d1d5db;line-height:1.8}
section{padding:30px 5%}
.title{text-align:center;font-size:25px;margin-bottom:25px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0000000b}
.product img{width:100%;height:165px;object-fit:cover;background:#eee}
.info{padding:15px}
.product h3{font-size:16px;margin-bottom:10px}
.price{color:#c18b00;font-weight:bold;font-size:18px;margin-bottom:12px}
.quantity{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px;margin-bottom:10px;font-size:16px}
.add-btn{width:100%;border:0;background:#101827;color:white;padding:12px;text-decoration:none;border-radius:7px;font-size:15px;cursor:pointer}
.add-btn:hover{background:#facc15;color:#111827}
footer{background:#080e18;color:#aaa;text-align:center;padding:25px}
.whatsapp{position:fixed;bottom:20px;left:20px;background:#25d366;color:white;text-decoration:none;padding:14px 18px;border-radius:30px;font-weight:bold}
@media(max-width:600px){
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product img{height:125px}
.info{padding:10px}
.product h3{font-size:14px}
}
</style>
</head>

<body>

<header>
<div class="logo">⚡ POWER <span>ZONE</span></div>
<a href="index.html">← الرئيسية</a>
<a class="cart-link" href="cart.html">🛒 السلة (<span id="cartCount">0</span>)</a>
</header>

<div class="hero">
<h1>منتجات فينوس</h1>
<p>اكتشف منتجات فينوس للمفاتيح والبرايز<br>
جودة مميزة لجميع احتياجاتك الكهربائية</p>
</div>

<section>
<h2 class="title">قسم فينوس</h2>

<div class="products">

<div class="product">
<img src="https://placehold.co/500x300?text=Venus+Socket" alt="بريزة فينوس">
<div class="info">
<h3>بريزة فينوس</h3>
<div class="price">28 جنيه</div>
<input class="quantity" type="number" min="1" value="1" aria-label="كمية بريزة فينوس">
<button class="add-btn" onclick="addToCart('بريزة فينوس',28,this)">إضافة إلى السلة 🛒</button>
</div>
</div>

<div class="product">
<img src="https://placehold.co/500x300?text=Venus+Switch" alt="مفتاح فينوس">
<div class="info">
<h3>مفتاح فينوس</h3>
<div class="price">28 جنيه</div>
<input class="quantity" type="number" min="1" value="1" aria-label="كمية مفتاح فينوس">
<button class="add-btn" onclick="addToCart('مفتاح فينوس',28,this)">إضافة إلى السلة 🛒</button>
</div>
</div>

<div class="product">
<img src="https://placehold.co/500x300?text=Venus+Chassis" alt="شاسيه فينوس">
<div class="info">
<h3>شاسيه فينوس</h3>
<div class="price">12 جنيه</div>
<input class="quantity" type="number" min="1" value="1" aria-label="كمية شاسيه فينوس">
<button class="add-btn" onclick="addToCart('شاسيه فينوس',12,this)">إضافة إلى السلة 🛒</button>
</div>
</div>

</div>
</section>

<footer>
<p>© 2026 POWER ZONE - جميع الحقوق محفوظة</p>
</footer>

<a class="whatsapp" href="https://wa.me/201155284381" target="_blank">واتساب 💬</a>

<script>
function getCart(){
return JSON.parse(localStorage.getItem('powerZoneCart')) || [];
}

function updateCartCount(){
const cart=getCart();
const count=cart.reduce((total,item)=>total+Number(item.quantity),0);
document.getElementById('cartCount').textContent=count;
}

function addToCart(name,price,button){
const quantityInput=button.parentElement.querySelector('.quantity');
const quantity=parseInt(quantityInput.value);

if(!Number.isInteger(quantity)||quantity<1){
alert('من فضلك أدخل كمية صحيحة');
return;
}

let cart=getCart();
const existing=cart.find(item=>item.name===name);

if(existing){
existing.quantity=Number(existing.quantity)+quantity;
}else{
cart.push({name:name,price:price,quantity:quantity});
}

localStorage.setItem('powerZoneCart',JSON.stringify(cart));
updateCartCount();

alert('تمت إضافة '+quantity+' من '+name+' إلى السلة');
quantityInput.value=1;
}

updateCartCount();
</script>

</body>
</html>
