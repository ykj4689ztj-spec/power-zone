
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاتيح كيون | POWER ZONE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#101827;color:white;padding:18px;text-align:center}
header h1{color:#facc15}
.container{max-width:900px;margin:35px auto;padding:15px}
.product{background:white;padding:25px;border-radius:12px;text-align:center;box-shadow:0 3px 12px #0001}
.product .icon{font-size:55px}
.product h2{margin:12px 0}
.product p{color:#64748b;margin:10px}
input{width:90px;padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin:15px}
button{background:#facc15;color:#101827;border:0;padding:12px 22px;border-radius:8px;font-weight:bold;cursor:pointer}
.back{display:inline-block;margin:20px;color:#101827;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>POWER ZONE ⚡</h1>
<p>قسم مفاتيح كيون</p>
</header>

<div class="container">
<a class="back" href="index.html">← الرجوع للرئيسية</a>

<div class="product">
<div class="icon">🔘</div>
<h2>مفاتيح كيون</h2>
<p>قسم مفاتيح كيون الكهربائية</p>
<p>للاستفسار عن الأنواع والموديلات المتاحة تواصل معنا.</p>

<label for="quantity">الكمية المطلوبة:</label>
<input type="number" id="quantity" min="1" value="1">

<br>
<button onclick="addToCart()">أضف إلى السلة 🛒</button>
<p id="message"></p>
</div>
</div>

<script>
function addToCart(){
  const quantity = Number(document.getElementById("quantity").value);

  if(!Number.isInteger(quantity) || quantity < 1){
    alert("اكتب كمية صحيحة");
    return;
  }

  let cart = [];

  try{
    cart = JSON.parse(localStorage.getItem("powerZoneCart") || "[]");
    if(!Array.isArray(cart)) cart = [];
  }catch(e){
    cart = [];
  }

  const existing = cart.find(item => item.name === "مفاتيح كيون");

  if(existing){
    existing.quantity = Number(existing.quantity || existing.qty || 0) + quantity;
    delete existing.qty;
  }else{
    cart.push({
      name:"مفاتيح كيون",
      quantity:quantity
    });
  }

  localStorage.setItem("powerZoneCart", JSON.stringify(cart));

  document.getElementById("message").textContent =
    "تمت إضافة المنتج إلى السلة بنجاح ✅";
}
</script>

</body>
</html>
